<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡樂童話大富翁 - 旗艦電視滿版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #fdfbf7; font-family: 'Fredoka', 'Noto Sans TC', sans-serif; overflow: hidden; }
        .board-grid { display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(10, 1fr); gap: 8px; width: 100%; height: 85vh; }
        .cube-dice { transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); transform-style: preserve-3d; }
        .dice-face { position: absolute; width: 110px; height: 110px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; background: white; border: 4px solid #f59e0b; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 bg-[#fdfbf7]">

    <!-- Header -->
    <header class="flex justify-between items-center bg-white border-4 border-amber-200 rounded-3xl p-4 mb-4 shadow-sm">
        <div class="flex items-center gap-4">
            <img src="https://placehold.co/80x80/f59e0b/white?text=🏰" class="rounded-2xl">
            <div>
                <h1 class="text-3xl font-black text-amber-900">歡樂童話大富翁</h1>
                <p class="text-amber-600 font-bold">溫馨手繪繪本風格</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openModal('cloudModal')" class="px-6 py-3 bg-blue-500 text-white font-black rounded-2xl">☁️ 雲端同步</button>
            <button onclick="openModal('rulesModal')" class="px-6 py-3 bg-sky-500 text-white font-black rounded-2xl">📖 遊戲規則</button>
        </div>
    </header>

    <!-- Main Game Area -->
    <div class="flex gap-4">
        <div id="board" class="board-grid flex-1 border-4 border-amber-200 rounded-3xl p-4 bg-amber-50">
            <!-- 棋盤格將由 JS 生成 -->
        </div>
    </div>

    <!-- Player Bar -->
    <div id="playersContainer" class="flex gap-4 mt-4 bg-white p-4 rounded-3xl border-4 border-amber-200">
        <!-- 玩家卡片 -->
    </div>

    <!-- Modals -->
    <div id="cloudModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-3xl max-w-lg w-full">
            <h2 class="text-2xl font-black mb-4">輸入 Firebase 設定</h2>
            <textarea id="firebaseConfigInput" rows="8" class="w-full border-2 p-4 rounded-xl font-mono text-xs"></textarea>
            <button onclick="saveFirebaseConfig()" class="w-full mt-4 py-4 bg-blue-500 text-white font-black rounded-xl">儲存設定</button>
        </div>
    </div>

    <script>
        function saveFirebaseConfig() {
            const raw = document.getElementById('firebaseConfigInput').value;
            try {
                // 自動清理非 JSON 字元
                let cleaned = raw.replace(/const\s+firebaseConfig\s+=\s+/g, '')
                                 .replace(/const\s+app\s+=\s+initializeApp\(firebaseConfig\);/g, '')
                                 .trim();
                if (cleaned.endsWith(';')) cleaned = cleaned.slice(0, -1);
                
                const config = JSON.parse(cleaned);
                localStorage.setItem('firebaseConfig', JSON.stringify(config));
                alert('✅ Firebase 設定已儲存！');
            } catch(e) {
                alert('❌ 格式錯誤，請確保輸入的是純 JSON 格式 (大括號內部的內容)。');
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        window.onload = () => { console.log("遊戲初始化..."); };
    </script>
</body>
</html>
